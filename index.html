<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow — Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="screen active">
    <div class="auth-bg">
      <div class="auth-orb orb1"></div>
      <div class="auth-orb orb2"></div>
      <div class="auth-orb orb3"></div>
    </div>
    <div class="auth-container">
      <div class="brand">
        <div class="brand-icon">✦</div>
        <span class="brand-name">TaskFlow</span>
      </div>
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="tab-btn active" data-tab="login">Sign in</button>
          <button class="tab-btn" data-tab="register">Register</button>
        </div>

        <!-- LOGIN FORM -->
        <div id="login-tab" class="tab-content active">
          <h2 class="form-title">Welcome back</h2>
          <p class="form-subtitle">Enter your credentials to continue</p>
          <div class="form-group">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" placeholder="your_username" autocomplete="username"/>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
          </div>
          <div id="login-error" class="form-error hidden"></div>
          <button class="btn-primary" id="login-btn">
            <span class="btn-text">Sign in</span>
            <span class="btn-loader hidden"></span>
          </button>
        </div>

        <!-- REGISTER FORM -->
        <div id="register-tab" class="tab-content hidden">
          <h2 class="form-title">Create account</h2>
          <p class="form-subtitle">Join TaskFlow and stay organized</p>
          <div class="form-group">
            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" placeholder="your_username" autocomplete="username"/>
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" placeholder="Min. 8 characters" autocomplete="new-password"/>
          </div>
          <div id="register-error" class="form-error hidden"></div>
          <div id="register-success" class="form-success hidden"></div>
          <button class="btn-primary" id="register-btn">
            <span class="btn-text">Create account</span>
            <span class="btn-loader hidden"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div id="dashboard-screen" class="screen hidden">
    <div class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">✦</div>
        <span class="brand-name">TaskFlow</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-item active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          All Tasks
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-avatar" id="user-avatar">U</div>
          <span id="sidebar-username">User</span>
        </div>
        <button class="logout-btn" id="logout-btn" title="Sign out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>

    <main class="main-content">
      <header class="content-header">
        <div>
          <h1 class="page-title">My Tasks</h1>
          <p class="page-sub" id="task-count-label">Loading…</p>
        </div>
        <button class="btn-add" id="open-add-modal">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Task
        </button>
      </header>

      <div id="task-error" class="alert-error hidden"></div>

      <div id="tasks-loading" class="loading-state">
        <div class="spinner"></div>
        <p>Fetching your tasks…</p>
      </div>

      <div id="tasks-empty" class="empty-state hidden">
        <div class="empty-icon">◎</div>
        <h3>Nothing here yet</h3>
        <p>Add your first task to get started</p>
      </div>

      <div id="task-list" class="task-list hidden"></div>
    </main>
  </div>

  <!-- ADD TASK MODAL -->
  <div id="add-modal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3>New Task</h3>
        <button class="modal-close" id="close-modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="form-group">
        <label for="task-input">Task description</label>
        <textarea id="task-input" placeholder="What needs to be done?" rows="3"></textarea>
      </div>
      <div id="add-task-error" class="form-error hidden"></div>
      <div class="modal-footer">
        <button class="btn-secondary" id="cancel-modal">Cancel</button>
        <button class="btn-primary" id="add-task-btn">
          <span class="btn-text">Add Task</span>
          <span class="btn-loader hidden"></span>
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
